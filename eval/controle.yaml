# Jeu de contrôle : 20 messages écrits après les règles et la consigne du modèle, dans un style
# plus libre. Ils ne servent jamais à régler les règles ni la consigne : ils mesurent ce que
# chaque approche fait face à des formulations qu'elle n'a jamais vues.

- id: H1
  group: Avant de réserver
  message: slt, vs prenez combien pr 3h chaque semaine ?? merci
  expected: { intent: [prix_budget], status: [pret], facts: [formule_budget, tarif_horaire], contains: ["571"] }

